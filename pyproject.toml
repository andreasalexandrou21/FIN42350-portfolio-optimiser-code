[project]
name = "fin42350-portfolio"
version = "0.1.0"
description = "FIN42350 group project: CAPM inputs and Markowitz optimisation of a EUR 1m portfolio"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "openpyxl",
    "cvxpy",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin42350_portfolio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
